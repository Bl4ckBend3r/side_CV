name: Aktualizacja PDF CV

on:
  push:
    branches: [main]
    paths:
      - 'ats/ogolne-pl.html'
      - 'ats/ogolne-en.html'
      - 'scripts/export_general_cv_pdfs.py'
      - '.github/workflows/export-cv-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-general-cv-pdfs
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF renderer
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Render updated PDFs
        run: python scripts/export_general_cv_pdfs.py
      - name: Check PDF files
        run: |
          test -s Witold_Grzesiak.pdf
          test -s Witold_Grzesiak_PL.pdf
          test -s Witold_Grzesiak_EN.pdf
      - name: Commit refreshed PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Witold_Grzesiak.pdf Witold_Grzesiak_PL.pdf Witold_Grzesiak_EN.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Refresh general CV PDFs from current ATS HTML"
            git push
          else
            echo "PDFs are already up to date."
          fi
