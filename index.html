<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="CV Witolda Grzesiaka dopasowane do stanowisk technicznych, automatyki, robotyki, analizy danych, Data Science, ML i AI.">
  <title>CV | Witold Grzesiak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/portal.css">
  <script src="./js/app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="Strona główna CV">
      <span class="brand-mark">WG</span>
      <span><strong>Witold Grzesiak</strong><small>Engineering · Data · AI</small></span>
    </a>
    <div class="header-actions">
      <a class="icon-link" href="https://github.com/Bl4ckBend3r" target="_blank" rel="noreferrer">GitHub</a>
      <a class="icon-link" href="https://www.linkedin.com/in/witoldgrzesiak/" target="_blank" rel="noreferrer">LinkedIn</a>
    </div>
  </header>

  <main class="layout">
    <aside class="catalog" aria-label="Warianty CV">
      <p class="eyebrow">Wybierz profil</p>
      <h1>CV dopasowane do stanowiska</h1>
      <p class="intro">Każdy wariant eksponuje inne kompetencje, zachowując zgodne dane o doświadczeniu i wykształceniu.</p>
      <nav id="cv-tabs" class="tabs" aria-label="Lista CV"></nav>
      <p id="catalog-status" class="status" role="status">Wczytywanie CV…</p>
    </aside>

    <section class="viewer" aria-live="polite">
      <div class="viewer-bar">
        <div><span class="viewer-label">Aktualnie wybrane</span><strong id="current-title">CV</strong></div>
        <div class="viewer-actions">
          <button id="print-cv" class="button button-primary" type="button">Zapisz jako PDF</button>
          <a id="download-cv" class="button" download>Pobierz HTML</a>
          <a id="open-cv" class="button" target="_blank" rel="noreferrer">Otwórz osobno</a>
        </div>
      </div>
      <iframe id="cv-frame" title="Podgląd wybranego CV"></iframe>
    </section>
  </main>

  <noscript>Do przełączania wariantów CV potrzebna jest obsługa JavaScript. <a href="./jobs/ogolne.html">Otwórz CV ogólne</a>.</noscript>
</body>
</html>
